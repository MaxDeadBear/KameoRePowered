# ObjPlayUpdateScore: `add r11, r11, r10` that sums the delta with the current
# score total. Fires after the add so r11 holds the new total; the hook injects
# any pending bonus before the `std r11, 0x80(r31)` store.
[[midasm_hook]]
address = 0x8217DBB0
name = "KameoAddScore"
registers = ["r11"]
after_instruction = true

# PlayerHitsCalcDamageFocus exit: overrides damage in f31 if the attacker is base Kameo.
[[midasm_hook]]
address = 0x821CAA28
name = "KameoOneShotDamage"
registers = ["r27", "f31"]

# Entry of kaiSackPopulate: add every warrior before the eventDone-gated adds.
[[midasm_hook]]
address = 0x8217CD20
name = "KameoUnlockAllWarriors"
registers = ["r3"]
