name: Build kameo

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for CI workflow-artifact, 'release' for GitHub release"
        required: true
        type: string
      artifact_name:
        description: "Artifact name prefix when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag to embed in release artifact filenames"
        required: false
        type: string
        default: ""

env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  ASSET_PATH: default.xex
  ASSET_CACHE_KEY: codegen-assets-v1
  TU_ASSET_CACHE_KEY: tu-assets-v1
  # ReXGlue SDK release to build against. Bump this to migrate.
  SDK_VERSION: v0.9.0
  # The SDK is distributed as a RelWithDebInfo build, so the project must use
  # a matching config -- the CMake package only exports *-relwithdebinfo targets.
  BUILD_PRESET: relwithdebinfo

jobs:
  build:
    name: Build (${{ matrix.variant }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows
          - linux
        variant:
          - vanilla
          - tu
        include:
          - platform: windows
            runner: windows-latest
            sdk_dir: win-amd64
            artifact_suffix: windows-x64

          - platform: linux
            runner: ubuntu-latest
            sdk_dir: linux-amd64
            artifact_suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-xcb-dev

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install llvm cmake ninja -y

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}-${{ matrix.variant }}-amd64

      - name: Download ReXGlue SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${SDK_VERSION}" --repo rexglue/rexglue-sdk \
            --pattern "*-${{ matrix.sdk_dir }}.zip" --output sdk.zip --clobber
          unzip -q sdk.zip -d sdk_unpacked
          # The archive holds a single versioned top-level directory.
          mv sdk_unpacked/* sdk
          chmod +x sdk/bin/rexglue || true
          echo "SDK_ROOT=$PWD/sdk" >> "$GITHUB_ENV"

      - name: Cache XEX asset for codegen
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: assets/${{ env.ASSET_PATH }}
          key: ${{ env.ASSET_CACHE_KEY }}

      - name: Fetch XEX asset
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ env.ASSETS_REPO }}/contents/${{ env.ASSET_PATH }}" \
            > "assets/${{ env.ASSET_PATH }}"
          size=$(wc -c < "assets/${{ env.ASSET_PATH }}")
          echo "Fetched ${{ env.ASSET_PATH }} ($size bytes)"
          [ "$size" -ge 1048576 ] || { echo "Asset too small — fetch likely failed"; exit 1; }

      - name: Cache TU packages
        if: matrix.variant == 'tu'
        id: tu-cache
        uses: actions/cache@v5
        with:
          path: tu_packages/
          key: ${{ env.TU_ASSET_CACHE_KEY }}

      - name: Fetch TU packages
        if: matrix.variant == 'tu' && steps.tu-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p tu_packages
          files=$(gh api "repos/${{ env.ASSETS_REPO }}/contents" \
            --jq '.[] | select(.name | startswith("TU_")) | .name')
          for f in $files; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ env.ASSETS_REPO }}/contents/${f}" \
              > "tu_packages/${f}"
            echo "Fetched ${f} ($(wc -c < "tu_packages/${f}") bytes)"
          done

      - name: Stage title update
        if: matrix.variant == 'tu'
        shell: bash
        run: |
          # Selects the TU variant matching our base XEX by digest, writes the
          # delta patch to the sibling path the loader looks for, and extracts
          # the per-language .str tables mounted as the update: device.
          python scripts/extract_tu.py tu_packages/TU_* \
            --base assets/default.xex \
            --output assets/default.xexp \
            --update-dir assets/TU

      - name: Codegen
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "tu" ]; then
            manifest=kameorepowered_tu_manifest.toml
          else
            manifest=kameorepowered_manifest.toml
          fi
          "${SDK_ROOT}/bin/rexglue" codegen "${manifest}"

      - name: Build
        shell: bash
        run: |
          preset="${{ matrix.sdk_dir }}-${BUILD_PRESET}"
          if [ "${{ matrix.variant }}" = "tu" ]; then kameo_tu=ON; else kameo_tu=OFF; fi
          cmake --preset "${preset}" \
            -DCMAKE_PREFIX_PATH="${SDK_ROOT}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DKAMEO_TU="${kameo_tu}"
          cmake --build --preset "${preset}" --parallel
          echo "BUILD_DIR=out/build/${preset}" >> "$GITHUB_ENV"

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package
        shell: bash
        run: |
          variant_tag=""
          if [ "${{ matrix.variant }}" = "tu" ]; then
            variant_tag="-tu"
          fi
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}${variant_tag}-${{ matrix.artifact_suffix }}"
          else
            out="kameorepowered${variant_tag}-${{ inputs.tag }}-${{ matrix.artifact_suffix }}"
          fi

          # rexglue_configure_target already staged the runtime + GPU plugin
          # libraries next to the executable, so the build dir is the payload.
          mkdir -p pkg
          cp "${BUILD_DIR}"/kameorepowered* pkg/ 2>/dev/null || true
          cp "${BUILD_DIR}"/*.dll pkg/ 2>/dev/null || true
          cp "${BUILD_DIR}"/*.so* pkg/ 2>/dev/null || true
          rm -f pkg/*.pdb pkg/*.ilk

          if [ "${{ matrix.platform }}" = "windows" ]; then
            archive="${out}.zip"
            (cd pkg && 7z a -tzip "../${archive}" .)
          else
            archive="${out}.tar.gz"
            tar -czf "${archive}" -C pkg .
          fi
          echo "ARTIFACT_PATH=${archive}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${out}" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact
        if: inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
