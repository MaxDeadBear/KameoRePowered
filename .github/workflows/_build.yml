name: Build kameo

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for a CI workflow artifact, 'release' for a GitHub release"
        required: true
        type: string
      build_preset:
        description: "CMake preset: relwithdebinfo or release"
        required: false
        type: string
        default: relwithdebinfo
      artifact_name:
        description: "Artifact name prefix when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag to embed in release artifact filenames"
        required: false
        type: string
        default: ""

env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  ASSET_PATH: default.xex
  ASSET_CACHE_KEY: codegen-assets-v1
  # Keep in step with sdk_version in kameorepowered_manifest.toml.
  SDK_VERSION: v0.10.0

jobs:
  build:
    name: Build (${{ matrix.platform }}, ${{ inputs.build_preset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            sdk_dir: win-amd64
            artifact_suffix: windows-x64
            compilers: ""
          - platform: linux
            # Pinned: ubuntu-latest became 26.04 in October 2026 and apt.llvm.org has no LLVM 20 repository for it yet.
            runner: ubuntu-24.04
            sdk_dir: linux-amd64
            artifact_suffix: linux-x64
            compilers: -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The shader cache is a 225 MB LFS object, so it is restored from the Actions cache rather than re-downloaded every run.
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        shell: bash
        run: git lfs pull

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libx11-xcb-dev

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install llvm cmake ninja -y

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}-${{ inputs.build_preset }}-amd64

      - name: Download ReXGlue SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${SDK_VERSION}" --repo rexglue/rexglue-sdk \
            --pattern "*-${{ matrix.sdk_dir }}.zip" --output sdk.zip --clobber
          unzip -q sdk.zip -d sdk_unpacked
          mv sdk_unpacked/* sdk
          chmod +x sdk/bin/rexglue || true
          echo "REXGLUE_SDK=$PWD/sdk" >> "$GITHUB_ENV"

      - name: Cache XEX asset for codegen
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: assets/${{ env.ASSET_PATH }}
          key: ${{ env.ASSET_CACHE_KEY }}

      - name: Fetch XEX asset
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ env.ASSETS_REPO }}/contents/${{ env.ASSET_PATH }}" \
            > "assets/${{ env.ASSET_PATH }}"
          size=$(wc -c < "assets/${{ env.ASSET_PATH }}")
          echo "Fetched ${{ env.ASSET_PATH }} ($size bytes)"
          [ "$size" -ge 1048576 ] || { echo "Asset too small, the fetch likely failed"; exit 1; }

      - name: Codegen
        shell: bash
        run: '"${REXGLUE_SDK}/bin/rexglue" codegen kameorepowered_manifest.toml'

      - name: Build
        shell: bash
        run: |
          preset="${{ inputs.build_preset }}"
          # The published SDK ships RelWithDebInfo only; the release preset maps onto it.
          cmake --preset "${preset}" ${{ matrix.compilers }} -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DKAMEO_VERSION="${{ inputs.tag || 'dev' }}"
          cmake --build --preset "${preset}" --parallel
          echo "BUILD_DIR=out/build/${preset}" >> "$GITHUB_ENV"

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.artifact_suffix }}"
          else
            out="kameorepowered-${{ inputs.tag }}-${{ matrix.artifact_suffix }}"
          fi

          # rexglue_setup_target staged the runtime and GPU plugin libraries next to the executable.
          mkdir -p pkg
          cp "${BUILD_DIR}"/kameorepowered* pkg/ 2>/dev/null || true
          cp "${BUILD_DIR}"/*.dll pkg/ 2>/dev/null || true
          cp "${BUILD_DIR}"/*.so* pkg/ 2>/dev/null || true
          # The Windows launcher, with the copy of the runtime it runs on so it never holds the game's (src/launcher/runtime_loader.cpp).
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "${BUILD_DIR}"/KameoLauncher.exe pkg/
            mkdir -p pkg/launcher
            cp "${BUILD_DIR}"/launcher/rexruntime.dll pkg/launcher/
            # The Blender add-on that makes mods (docs/modding.md): one zip for Blender 3.6 and newer, and one for 2.79
            # holding its bridge add-on with the modkit inside it.
            mkdir -p pkg/modkit modkit_stage/kameo_modkit_279
            (cd tools/modkit && 7z a -tzip ../../pkg/modkit/kameo_modkit.zip kameo_modkit '-xr!__pycache__')
            cp tools/modkit/addon_279/__init__.py modkit_stage/kameo_modkit_279/
            cp -r tools/modkit/kameo_modkit modkit_stage/kameo_modkit_279/
            (cd modkit_stage && 7z a -tzip ../pkg/modkit/kameo_modkit_blender279.zip kameo_modkit_279 '-xr!__pycache__')
          fi
          rm -f pkg/*.pdb pkg/*.ilk
          # No symbols ship: the Linux build carries its debug information inside the binaries, so it is stripped.
          if [ "${{ matrix.platform }}" != "windows" ]; then
            strip --strip-all pkg/kameorepowered
            strip --strip-unneeded pkg/*.so*
          fi

          if [ "${{ matrix.platform }}" = "windows" ]; then
            archive="${out}.zip"
            (cd pkg && 7z a -tzip "../${archive}" .)
          else
            archive="${out}.tar.gz"
            tar -czf "${archive}" -C pkg .
          fi
          echo "ARTIFACT_PATH=${archive}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${out}" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact
        if: inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
